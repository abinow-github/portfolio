<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" width="480" height="580">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E0E10"/>
      <stop offset="100%" style="stop-color:#0A0A0B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E1011"/>
      <stop offset="100%" style="stop-color:#C41E3A"/>
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1F"/>
      <stop offset="100%" style="stop-color:#101013"/>
    </linearGradient>
    <clipPath id="photoClip">
      <rect width="480" height="580" rx="0"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="580" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#F0EDE8" stroke-width="0.5">
    <line x1="60" y1="0" x2="60" y2="580"/>
    <line x1="120" y1="0" x2="120" y2="580"/>
    <line x1="180" y1="0" x2="180" y2="580"/>
    <line x1="240" y1="0" x2="240" y2="580"/>
    <line x1="300" y1="0" x2="300" y2="580"/>
    <line x1="360" y1="0" x2="360" y2="580"/>
    <line x1="420" y1="0" x2="420" y2="580"/>
    <line x1="0" y1="60" x2="480" y2="60"/>
    <line x1="0" y1="120" x2="480" y2="120"/>
    <line x1="0" y1="180" x2="480" y2="180"/>
    <line x1="0" y1="240" x2="480" y2="240"/>
    <line x1="0" y1="300" x2="480" y2="300"/>
    <line x1="0" y1="360" x2="480" y2="360"/>
    <line x1="0" y1="420" x2="480" y2="420"/>
    <line x1="0" y1="480" x2="480" y2="480"/>
    <line x1="0" y1="540" x2="480" y2="540"/>
  </g>

  <!-- Accent glow orb (background) -->
  <ellipse cx="380" cy="120" rx="160" ry="160" fill="#8E1011" opacity="0.06" filter="url(#glow)"/>
  <ellipse cx="100" cy="460" rx="120" ry="120" fill="#C41E3A" opacity="0.04" filter="url(#glow)"/>

  <!-- Person silhouette — shoulders + body -->
  <ellipse cx="240" cy="480" rx="180" ry="80" fill="url(#silhouetteGrad)" opacity="0.9"/>
  <path d="M100 580 Q100 420 160 380 Q200 360 240 355 Q280 360 320 380 Q380 420 380 580 Z"
        fill="url(#silhouetteGrad)" opacity="0.95"/>

  <!-- Torso / clothing shape -->
  <path d="M155 400 Q180 370 240 360 Q300 370 325 400 L340 580 L140 580 Z"
        fill="#0D0D0F" opacity="0.7"/>

  <!-- Neck -->
  <rect x="218" y="268" width="44" height="55" rx="8" fill="#1C1C20" opacity="0.9"/>

  <!-- Head -->
  <ellipse cx="240" cy="225" rx="78" ry="88" fill="#1A1A1F"/>

  <!-- Face subtle gradient -->
  <ellipse cx="240" cy="215" rx="66" ry="76" fill="#1E1E24"/>

  <!-- Hair -->
  <path d="M162 215 Q155 155 175 130 Q190 105 220 98 Q240 93 260 98 Q290 105 310 135 Q328 160 318 215 Q300 175 285 162 Q265 150 240 148 Q215 150 195 162 Q178 175 162 215 Z"
        fill="#0D0D0E"/>
  <!-- Side hair -->
  <path d="M162 215 Q158 245 163 270 Q170 285 180 288 Q168 260 168 235 Z" fill="#0D0D0E"/>
  <path d="M318 215 Q322 245 317 270 Q310 285 300 288 Q312 260 312 235 Z" fill="#0D0D0E"/>

  <!-- Eyes -->
  <ellipse cx="213" cy="220" rx="10" ry="7" fill="#0A0A0B"/>
  <ellipse cx="267" cy="220" rx="10" ry="7" fill="#0A0A0B"/>
  <circle cx="215" cy="219" r="3" fill="#2a2a30"/>
  <circle cx="269" cy="219" r="3" fill="#2a2a30"/>

  <!-- Nose -->
  <path d="M237 235 Q240 248 244 235" stroke="#2a2a30" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Lips - subtle smile -->
  <path d="M224 258 Q232 264 240 265 Q248 264 256 258" stroke="#8E1011" stroke-width="1.8" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Earrings (subtle accent) -->
  <circle cx="163" cy="240" r="4" fill="#8E1011" opacity="0.7"/>
  <circle cx="317" cy="240" r="4" fill="#8E1011" opacity="0.7"/>

  <!-- Decorative border lines -->
  <rect x="20" y="20" width="440" height="540" fill="none" stroke="#18181C" stroke-width="1"/>
  <rect x="14" y="14" width="452" height="552" fill="none" stroke="#141418" stroke-width="0.5"/>

  <!-- Corner accents -->
  <path d="M20 20 L60 20 M20 20 L20 60" stroke="#8E1011" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M460 20 L420 20 M460 20 L460 60" stroke="#8E1011" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M20 560 L60 560 M20 560 L20 520" stroke="#8E1011" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M460 560 L420 560 M460 560 L460 520" stroke="#8E1011" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Bottom label -->
  <rect x="0" y="530" width="480" height="50" fill="rgba(10,10,11,0.92)"/>
  <text x="240" y="550" text-anchor="middle" font-family="'Syne', sans-serif" font-size="9" font-weight="700"
        letter-spacing="4" text-transform="uppercase" fill="#6E6E78">SEETHA LAKSHMI.M</text>
  <text x="240" y="568" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7"
        letter-spacing="3" fill="#C41E3A" opacity="0.7">SEO STRATEGIST</text>

  <!-- Accent line at bottom -->
  <rect x="160" y="576" width="160" height="1.5" fill="url(#accentGrad)" opacity="0.5"/>
</svg>
